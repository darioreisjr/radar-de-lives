# CI do Radar de Lives (spec 009 / sprint S-04)
# Roda lint, typecheck, testes e build em todo push e em PRs para main.
# Depois, o job e2e roda os testes de interface do Playwright (spec 014), sem segredos.
# Actions fixadas por SHA (D2). Para atualizar:
#   gh api repos/actions/checkout/releases/latest --jq .tag_name
#   gh api repos/actions/checkout/git/ref/tags/<tag> --jq .object.sha
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # Segredos só no servidor (plano multiplataforma §5.5, spec 027 CA6): o bundle do navegador
      # não pode conter o endpoint de token nem os nomes das credenciais da Twitch e da Kick.
      - name: Bundle do cliente sem credenciais
        run: |
          if grep -rlE "id\.twitch\.tv/oauth2|TWITCH_CLIENT_SECRET|id\.kick\.com/oauth|KICK_CLIENT_SECRET" .next/static; then
            echo "::error::Credencial ou endpoint de token no bundle do cliente"
            exit 1
          fi

  e2e:
    name: Testes de interface (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Sem chave do YouTube e com /api/ simulada no navegador: nada de quota (spec 014).
      - name: Testes de interface
        run: npm run test:e2e
